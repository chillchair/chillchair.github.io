:root{--paper:#FBF6EF;--card:#FFFDF9;--ink:#1C1818;--coffee:#3A2A22;--gold:#9B7330;--muted:#6B625A;--line:rgba(58,42,34,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:Rubik,RubikL,system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:28px 0 10px;text-align:center;background:radial-gradient(ellipse 90% 70% at 50% 0%,#fff 0%,var(--paper) 70%)}
header img{width:150px;height:auto}
header p{margin-top:8px;font-size:14px;color:var(--muted)}
nav{position:sticky;top:0;z-index:5;background:rgba(251,246,239,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;justify-content:center;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;font-size:13px;font-weight:500;padding:8px 11px;border-radius:99px;border:1px solid rgba(58,42,34,.3);color:var(--coffee);white-space:nowrap;min-height:40px;display:flex;align-items:center}
nav a.on{background:var(--coffee);color:var(--paper);border-color:var(--coffee)}
nav a.hot{border-color:var(--gold);color:#8C6A44;font-weight:700;background:#F6EEE2}
nav a.hot.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.ostrip .tx .ft{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#8C6A44;margin-top:2px}
.ostrip .tx .ft svg{width:14px;height:14px;color:#C9A36E;flex:none}
.ostrip{margin-bottom:14px}
.ostrip .pp{min-width:96px}
#offers .ttl h2{font-size:36px}
.ostrip{flex-wrap:wrap}
.more{flex:0 0 100%;margin-top:10px;border-top:1px dashed rgba(58,42,34,.35);padding-top:8px}
.more summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;font-size:14px;font-weight:700;color:#8C6A44;cursor:pointer}
.more summary::-webkit-details-marker{display:none}
.more summary svg{width:16px;height:16px;transition:transform .2s}
.more[open] summary svg{transform:rotate(180deg)}
.more[open] summary span::after{content:""}
.more .mbody{padding:6px 2px 4px;text-align:center}
.more .base{font-size:15px;font-weight:700;padding-bottom:7px;border-bottom:1px solid var(--line)}
.more .feat{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 2px;padding:8px 10px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(90deg,#F6EEE2,#FFFDF8,#F6EEE2);font-size:14px;font-weight:700;color:#8C6A44}
.more .feat svg{width:16px;height:16px;flex:none;color:#C9A36E}
.more .xg{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;text-align:start}
.more .xg span{font-size:14px;font-weight:500;padding:7px 2px;border-bottom:1px dashed var(--line)}
.ttl{text-align:center;margin:34px 0 18px}
.ttl h2{font-family:Baloo,Rubik;font-weight:800;font-size:32px;line-height:1.1;color:var(--coffee)}
.ttl h2 em{font-style:normal;color:var(--gold)}
.ttl .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;color:var(--gold);font-size:13px}
.ttl .orn::before,.ttl .orn::after{content:"";width:48px;height:1px;background:var(--gold);opacity:.6}
/* tickets */
.tk{position:relative;background:var(--card);border:1.5px solid var(--coffee);border-radius:12px;margin-bottom:16px;overflow:hidden}
.tk::after{content:"";position:absolute;inset:6px;border:.75px solid rgba(155,115,48,.45);border-radius:8px;pointer-events:none}
.tk .top{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;border-bottom:1.5px dashed rgba(58,42,34,.5)}
.tk .top img{width:64px;height:64px;object-fit:contain;flex:none}
.tk .top h3{font-family:Baloo,Rubik;font-weight:800;font-size:22px;color:var(--coffee);line-height:1.2}
.tk .top small{display:block;font-size:12.5px;color:var(--muted)}
.tk ul{list-style:none;padding:6px 18px 12px}
.tk li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tk li:last-child{border-bottom:none}
.tk li .n{font-size:16px;font-weight:500}
.tk li .nt{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.tk li .f{flex:1}
.tk li .p{font-family:RubikL,Rubik;font-weight:700;font-size:18px;color:var(--coffee);white-space:nowrap}
.tk li .p small{font-family:Rubik;font-weight:400;font-size:12px;color:var(--muted);margin-inline-start:3px}
.tk li .v{font-size:13.5px;font-weight:500;color:var(--gold);white-space:nowrap}
.tk li.hl{margin:6px -6px 0;padding:10px 10px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(90deg,#F6EEE2,#FFFDF8)}
.tk li.hl .n{font-weight:700}
.notch{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1.5px solid var(--coffee);z-index:2}
/* CC hero */
.cc{position:relative;text-align:center;padding:26px 20px 24px;margin:6px 4px 22px;border:2px solid var(--coffee);border-radius:46% 46% 14px 14px / 120px 120px 14px 14px;background:radial-gradient(ellipse 70% 60% at 50% 30%,#fff,#FDF8F0 45%,#F4EADB)}
.cc::before{content:"";position:absolute;inset:-7px;border:1px solid rgba(58,42,34,.35);border-radius:inherit}
.cc::after{content:"";position:absolute;inset:5px;border:1px solid var(--gold);border-radius:inherit;pointer-events:none}
.cc img{height:42px;width:auto}
.cc h3{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.cc h3 span{font-family:Baloo,Rubik;font-weight:800;font-size:26px;color:var(--coffee)}
.cc h3 b{font-family:RubikL;font-weight:700;font-size:30px;letter-spacing:3px;direction:ltr;color:var(--coffee)}
.cc .row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.seven{position:relative;width:62px;height:62px;border-radius:50%;border:2px solid var(--coffee);display:flex;align-items:center;justify-content:center;font-family:RubikL;font-weight:700;font-size:34px;color:var(--coffee)}
.seven::before{content:"";position:absolute;inset:4px;border:1px solid var(--gold);border-radius:50%}
.cc .lab{font-family:Baloo,Rubik;font-weight:800;font-size:16px;line-height:1.25;text-align:start;color:var(--coffee)}
.cc .sep{width:1px;height:56px;background:linear-gradient(transparent,var(--gold),transparent)}
.cc .pr{font-family:RubikL;font-weight:700;font-size:42px;color:var(--coffee);line-height:1}
.cc .pr small{font-family:Rubik;font-weight:400;font-size:14px;color:var(--muted);margin-inline-start:4px}
.cc .ask{display:inline-block;margin-top:14px;font-size:14px;font-weight:500;color:var(--paper);background:var(--coffee);border-radius:99px;padding:7px 22px 9px}
/* strip */
.strip{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--coffee);border-radius:12px;padding:12px 14px;margin-bottom:22px}
.strip img{width:54px;height:54px;object-fit:contain;flex:none}
.strip .tx{flex:1}
.strip .tx b{display:block;font-family:Baloo,Rubik;font-weight:800;font-size:21px;color:var(--coffee);line-height:1.2}
.strip .tx span{font-size:14px}
.strip .pp{flex:none;text-align:center;padding-inline-start:14px;border-inline-start:1.5px dashed var(--coffee)}
/* packages */
.pkg{position:relative;text-align:center;margin:0 4px 26px;padding:30px 18px 22px;border:1.6px solid var(--coffee);border-radius:50% 50% 14px 14px / 110px 110px 14px 14px;background:linear-gradient(180deg,#FFFEFB,#FBF6EF 55%,#F6EEE2)}
.pkg::before{content:"";position:absolute;inset:-6px;border:.75px solid rgba(58,42,34,.35);border-radius:inherit}
.pkg::after{content:"";position:absolute;inset:5px;border:.75px solid rgba(155,115,48,.45);border-radius:inherit;pointer-events:none}
.pkg > img{height:110px;width:auto;max-width:60%;margin-top:4px}
.pkg h3{font-family:Baloo,Rubik;font-weight:800;font-size:26px;color:var(--coffee);margin-top:6px}
.pkg .dv{width:80px;height:1px;margin:8px auto 10px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.pkg .base{font-size:16px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pkg .feat{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;padding:9px 10px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(90deg,#F6EEE2,#FFFDF8,#F6EEE2);font-size:15px;font-weight:700;color:#8C6A44}
.pkg .feat svg{width:18px;height:18px;flex:none;color:#C9A36E}
.pkg .xg{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;text-align:start}
.pkg .xg span{font-size:14.5px;font-weight:500;padding:8px 2px;border-bottom:1px dashed var(--line)}
.pp .was,.price .was{position:relative;display:inline-block;font-family:RubikL;font-weight:500;font-size:16px;color:#8C8178;margin-inline-end:8px}
.pp .was::after,.price .was::after{content:"";position:absolute;left:-10%;right:-10%;top:50%;height:2px;background:var(--gold);transform:rotate(-12deg)}
.pp .now,.price .now{font-family:RubikL;font-weight:700;font-size:30px;color:var(--coffee);line-height:1}
.pp .now small,.price .now small{font-family:Rubik;font-weight:400;font-size:13px;color:var(--muted);margin-inline-start:3px}
.price{margin-top:16px}
.save{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:500;color:var(--paper);background:var(--coffee);border-radius:99px;padding:3px 12px 5px}
.offer-banner{display:none!important;text-align:center;margin:26px 0 0;padding:14px;border-radius:12px;background:var(--coffee);color:var(--paper)}
.offer-banner b{display:block;font-family:Baloo,Rubik;font-weight:800;font-size:28px;line-height:1.2}
.offer-banner b em{font-style:normal;color:#E3C99C}
.offer-banner span{font-size:13.5px;color:#d9c7ae}
body.offers .offer-banner{display:block}
/* footer */
footer{margin-top:30px;padding:26px 0 40px;background:#1C1818;color:#F1D9BB;text-align:center}
footer .rv{display:inline-flex;align-items:center;gap:8px;margin-top:4px;background:#F1D9BB;color:#1C1818;font-weight:700;font-size:15px;padding:12px 22px;border-radius:99px;min-height:44px}
footer .rv i{font-style:normal;color:#E8B84B;letter-spacing:1px}
footer h4{font-family:Baloo,Rubik;font-weight:800;font-size:22px;color:#FFF1DC}
footer .links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
footer .links a{display:flex;align-items:center;gap:6px;font-size:14px;padding:10px 16px;border:1px solid rgba(241,217,187,.35);border-radius:99px;min-height:44px}
footer .links a span{font-family:RubikL;direction:ltr}
footer svg{width:16px;height:16px}
footer .addr{margin-top:14px;font-size:13px;color:#bfa98c}
</style>

const R = '<small>ريال</small>';
const money = (price, offer) => (offer && offer < price)
  ? `<span class="was">${price}</span><span class="now">${offer}${R}</span><br><span class="save">وفّر ${price-offer} ريال</span>`
  : `<span class="now">${price}${R}</span>`;

function ticket(g){
  const rows = g.items.map(([n,p,nt,hl]) => `<li class="${hl?'hl':''}"><span class="n">${n}${nt?`<span class="nt">${nt}</span>`:''}</span><span class="f"></span>${
    typeof p==='number' ? `<span class="p">${p}${R}</span>` : `<span class="v">${p}</span>`}</li>`).join('');
  return `<div class="tk"><span class="notch" style="right:-10px;top:42px"></span><span class="notch" style="left:-10px;top:42px"></span>
    <div class="top">${g.img?`<img src="${IMG[g.img]}" alt="">`:''}<div><h3>${g.name}</h3>${g.note?`<small>${g.note}</small>`:''}</div></div><ul>${rows}</ul></div>`;
}
function pkg(p){
  return `<div class="pkg"><img src="${IMG[p.img]}" alt=""><h3>${p.name}</h3><div class="dv"></div>
    <div class="base">${BASE}</div>${p.feat.map(f=>`<div class="feat">${SPK}${f}</div>`).join('')}
    <div class="xg">${p.items.map(i=>`<span>${i}</span>`).join('')}</div><div class="price">${money(p.price)}</div></div>`;
}
function strip(img, name, desc, price, offer){
  return `<div class="strip">${img}<div class="tx"><b>${name}</b><span>${desc}</span></div><div class="pp">${money(price,offer)}</div></div>`;
}
const CAR = '<svg width="54" height="27" viewBox="0 0 64 32" fill="none" stroke="#2B1E18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 24h-2v-7l5-2 7-8h22l9 8 9 2v7h-3"/><path d="M20 9v6h24M32 9v6M16 15h30"/><circle cx="15" cy="24" r="4.5"/><circle cx="49" cy="24" r="4.5"/><path d="M20 24h24"/></svg>';

let html = '';
for (const sec of SERVICES){
  html += `<section id="${sec.id}"><div class="ttl"><h2>${sec.title}</h2></div>${sec.groups.map(ticket).join('')}</section>`;
}

  <div class="cc"><img src="${MARK}" alt=""><h3><span>باقة</span><b>CC</b></h3>
    <div class="row"><div style="display:flex;align-items:center;gap:10px"><div class="seven">${CC.count}</div><div class="lab">خدمات<br>في باقة واحدة</div></div>
    <span class="sep"></span><div class="pr">${CC.price}<small>ريال</small></div></div><span class="ask">اسأل عنها</span></div>
  ${strip(`<img src="${IMG.cut}" alt="">`, 'الكلاسيك', BASE, CLASSIC.price)}
  ${PACKAGES.map(pkg).join('')}
</section>`;
if (OFFERS){
  const os = (img, name, desc, price, offer, p) => `<div class="strip ostrip">${img}<div class="tx"><b>${name}</b>${desc}</div><div class="pp">${money(price,offer)}</div>${p ? `
    <details class="more"><summary><span>شوف الباقة كاملة</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></summary>
    <div class="mbody"><div class="base">${BASE}</div>${p.feat.map(f=>`<div class="feat">${SPK}${f}</div>`).join('')}<div class="xg">${p.items.map(i=>`<span>${i}</span>`).join('')}</div></div></details>` : ''}</div>`;
  html += `<section id="offers">
    <div class="ttl"><h2>روّق <em>و</em>وفّر</h2><div class="orn">عروض الباقات</div></div>
    ${os(`<img src="${IMG.cut}" alt="">`, 'الكلاسيك', `<span>${BASE}</span>`, CLASSIC.price, CLASSIC.offer)}
    ${PACKAGES.map(p => os(`<img src="${IMG[p.img]}" alt="">`, p.name, p.feat.map(f=>`<span class="ft">${SPK}${f}</span>`).join(''), p.price, p.offer, p)).join('')}
    ${os(CAR, 'العائلة', '<span>عرض الأخوين: حلاقة شعر لطفلين حتى 12 سنة</span>', FAMILY.price, FAMILY.offer)}
    
  </section>`;
}
document.getElementById('app').innerHTML = html;
if (!OFFERS) document.getElementById('offTab').remove();

/* highlight current section in the top bar */
const links = [...document.querySelectorAll('nav a')];
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
}), { rootMargin: '-45% 0px -50% 0px' });
document.querySelectorAll('main section').forEach(s => obs.observe(s));
</script>
</body>
</html>
